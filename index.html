<!doctype html>
<html lang="la"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rēgnum Iovis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="wrap">
  <div id="title">
    <canvas id="titleart" width="240" height="160"></canvas>
    <h1>Rēgnum Iovis</h1>
    <button id="btn-la">Latīnē</button>
    <button id="btn-en">English</button>
  </div>
  <canvas id="game" width="960" height="624" hidden></canvas>
  <div id="hud" hidden></div>
  <div id="lvl" hidden></div>
  <div id="toast" hidden></div>
  <button id="bookbtn" hidden></button>
  <div id="book" hidden></div>
  <div id="story" hidden></div>
  <div id="finale" hidden></div>
  <div id="msg" hidden><div id="msg-art"></div><div id="msg-text"></div><div id="choices"></div><button id="msg-btn" disabled></button></div>
  <div id="pad" hidden>
    <button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button><button data-d="act">●</button>
  </div>
</div>
<script src="boot.js"></script>
</body></html>
